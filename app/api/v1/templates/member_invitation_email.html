<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>Team Invitation</title>
  </head>
  <body style="background:#f7fafd;padding:24px;">
    <div style="max-width:600px;margin:0 auto;background:#fff;border-radius:8px;padding:64px 24px 64px 24px;box-sizing:border-box;">
      <!-- Logo -->
      <div style="text-align:center;margin-bottom:48px;">
        <img src="https://app.dev.salessmart.jp/logo/salesmart_logo.png" alt="SALES SMART" style="height:40px;" />
      </div>
      <!-- Title -->
      <div style="text-align:center;font-size:20px;font-weight:bold;margin-bottom:48px;">
        あなたは”{{inviter_name}}”のチームに招待されました！
      </div>
      <!-- Description -->
      <div style="text-align:center;font-size:14px;margin-bottom:12px;color:#222;">
        「招待を承諾」をクリックして、チームに参加してください。
      </div>
      <!-- Note -->
      <div style="font-size:14px;color:#5877F2;border-radius:6px;margin-bottom:48px;text-align:center;">
        {{inviter_name}}様の招待を承諾するには、ご自身のアカウントを削除する必要があります。その後、{{inviter_name}}様のチームに追加されます。
      </div>
      <!-- Button -->
      <div style="text-align:center;">
        <a href="{{ url }}" style="display:inline-block;padding:8px 24px;background:#5877F2;color:#fff;font-weight:500;border-radius:6px;text-decoration:none;font-size:14px;">招待を承諾</a>
      </div>
    </div>
  </body>
</html>
