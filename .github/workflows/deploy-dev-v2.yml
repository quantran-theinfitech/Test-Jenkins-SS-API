name: Deploy Dev v2

on:
  workflow_dispatch:

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Build
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_JOB: ${{ secrets.JENKINS_JOB_NAME || 'ss-api-test' }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          if [ -z "$JENKINS_URL" ] || [ -z "$JENKINS_TOKEN" ]; then
            echo "Error: JENKINS_URL and JENKINS_TOKEN must be set in repository secrets"
            exit 1
          fi
          
          echo "Triggering Jenkins job: $JENKINS_JOB at $JENKINS_URL"
          
          # Bypass ngrok warning page if needed
          NGROK_BYPASS_HEADER="-H 'ngrok-skip-browser-warning: true'"
          
          # Get CSRF token
          echo "Getting CSRF token..."
          CRUMB_RESPONSE=$(curl -s -u "$JENKINS_USER:$JENKINS_TOKEN" \
            -H "ngrok-skip-browser-warning: true" \
            "$JENKINS_URL/crumbIssuer/api/xml?xpath=concat(//crumbRequestField,\":\",//crumb)" 2>&1)
          
          # Extract crumb from response (format: Jenkins-Crumb:token-value)
          CRUMB=$(echo "$CRUMB_RESPONSE" | grep -E "^Jenkins-Crumb:" | head -1 || echo "")
          
          if [ -n "$CRUMB" ]; then
            echo "CSRF token obtained: ${CRUMB:0:20}..."
          else
            echo "No CSRF token required or failed to get"
            CRUMB=""
          fi
          
          # Trigger build with proper form submission
          echo "Triggering build..."
          
          # Build headers array
          HEADERS=(-u "$JENKINS_USER:$JENKINS_TOKEN")
          HEADERS+=(-H "ngrok-skip-browser-warning: true")
          HEADERS+=(-H "Content-Type: application/x-www-form-urlencoded")
          if [ -n "$CRUMB" ]; then
            HEADERS+=(-H "$CRUMB")
          fi
          
          # Try build endpoint with empty form data
          HTTP_CODE=$(curl -X POST \
            "${HEADERS[@]}" \
            --data "" \
            -s -w "%{http_code}" \
            -o /tmp/jenkins_response.txt \
            "$JENKINS_URL/job/$JENKINS_JOB/build" 2>&1)
          
          RESPONSE=$(cat /tmp/jenkins_response.txt 2>/dev/null || echo "")
          HTTP_CODE_ONLY=$(echo "$HTTP_CODE" | grep -oE '[0-9]{3}$' || echo "$HTTP_CODE")
          
          # If that fails, try buildWithParameters with json parameter
          if [ "$HTTP_CODE_ONLY" != "201" ] && [ "$HTTP_CODE_ONLY" != "200" ]; then
            echo "First attempt failed (HTTP $HTTP_CODE_ONLY), trying buildWithParameters..."
            HTTP_CODE=$(curl -X POST \
              "${HEADERS[@]}" \
              --data "json={}" \
              -s -w "%{http_code}" \
              -o /tmp/jenkins_response.txt \
              "$JENKINS_URL/job/$JENKINS_JOB/buildWithParameters" 2>&1)
            RESPONSE=$(cat /tmp/jenkins_response.txt 2>/dev/null || echo "")
            HTTP_CODE_ONLY=$(echo "$HTTP_CODE" | grep -oE '[0-9]{3}$' || echo "$HTTP_CODE")
          fi
          
          # Extract HTTP code
          HTTP_CODE_ONLY=$(echo "$HTTP_CODE" | grep -oE '[0-9]{3}$' || echo "$HTTP_CODE")
          
          if [ "$HTTP_CODE_ONLY" != "201" ] && [ "$HTTP_CODE_ONLY" != "200" ]; then
            echo "✗ Failed to trigger build (HTTP $HTTP_CODE_ONLY)"
            echo "Full response:"
            echo "$RESPONSE" | head -20
            exit 1
          fi
          
          echo "✓ Jenkins build triggered successfully! (HTTP $HTTP_CODE_ONLY)"
          
          # Wait for build to start and get build number
          echo "Waiting for build to start..."
          sleep 5
          
          # Poll build status and stream console output
          MAX_WAIT=1800  # 30 minutes max
          ELAPSED=0
          INTERVAL=2     # Check every 2 seconds for real-time updates
          LAST_OFFSET=0
          BUILD_NUMBER=""
          FIRST_BUILD_NUMBER=""
          
          echo "=== Jenkins Build Console Output ==="
          echo ""
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            BUILD_INFO=$(curl -s -u "$JENKINS_USER:$JENKINS_TOKEN" \
              -H "ngrok-skip-browser-warning: true" \
              "$JENKINS_URL/job/$JENKINS_JOB/lastBuild/api/json" 2>/dev/null || echo "")
            
            if [ -z "$BUILD_INFO" ] || echo "$BUILD_INFO" | grep -q "404\|Not Found\|<html"; then
              if [ $ELAPSED -lt 10 ]; then
                sleep $INTERVAL
                ELAPSED=$((ELAPSED + INTERVAL))
                continue
              else
                echo "Error: Could not get build info"
                exit 1
              fi
            fi
            
            # Extract build number and status - use sed for more reliable parsing
            BUILD_NUMBER=$(echo "$BUILD_INFO" | sed -n 's/.*"number":\([0-9]*\).*/\1/p' | head -1)
            BUILDING=$(echo "$BUILD_INFO" | sed -n 's/.*"building":\([^,}]*\).*/\1/p' | head -1 | tr -d ' "')
            RESULT=$(echo "$BUILD_INFO" | sed -n 's/.*"result":"\([^"]*\)".*/\1/p' | head -1)
            
            # Set first build number if not set
            if [ -z "$FIRST_BUILD_NUMBER" ] && [ -n "$BUILD_NUMBER" ]; then
              FIRST_BUILD_NUMBER="$BUILD_NUMBER"
              echo "Tracking build #$BUILD_NUMBER"
            fi
            
            # Use first build number to ensure we're tracking the correct build
            if [ -n "$FIRST_BUILD_NUMBER" ]; then
              BUILD_NUMBER="$FIRST_BUILD_NUMBER"
            fi
            
            if [ -z "$BUILD_NUMBER" ] || [ "$BUILD_NUMBER" = "unknown" ]; then
              sleep $INTERVAL
              ELAPSED=$((ELAPSED + INTERVAL))
              continue
            fi
            
            # Get progressive console output (real-time)
            CONSOLE_RESPONSE=$(curl -s -u "$JENKINS_USER:$JENKINS_TOKEN" \
              -H "ngrok-skip-browser-warning: true" \
              "$JENKINS_URL/job/$JENKINS_JOB/$BUILD_NUMBER/logText/progressiveText?start=$LAST_OFFSET" 2>/dev/null || echo "")
            
            if [ -n "$CONSOLE_RESPONSE" ] && ! echo "$CONSOLE_RESPONSE" | grep -q "<html\|404"; then
              # progressiveText returns: content\noffset
              # Extract content (all but last line) and offset (last line)
              LINE_COUNT=$(echo "$CONSOLE_RESPONSE" | wc -l)
              if [ "$LINE_COUNT" -gt 1 ]; then
                NEW_CONTENT=$(echo "$CONSOLE_RESPONSE" | head -n -1)
                NEW_OFFSET=$(echo "$CONSOLE_RESPONSE" | tail -n 1 | grep -oE '^[0-9]+$' || echo "")
              else
                NEW_CONTENT=""
                NEW_OFFSET=$(echo "$CONSOLE_RESPONSE" | grep -oE '^[0-9]+$' || echo "")
              fi
              
              if [ -n "$NEW_CONTENT" ]; then
                echo -n "$NEW_CONTENT"
              fi
              
              if [ -n "$NEW_OFFSET" ] && [ "$NEW_OFFSET" != "$LAST_OFFSET" ]; then
                LAST_OFFSET=$NEW_OFFSET
              fi
            fi
            
            # Check if build is complete
            if [ "$BUILDING" = "false" ] && [ -n "$RESULT" ] && [ "$RESULT" != "null" ]; then
              # Get remaining console output
              FINAL_RESPONSE=$(curl -s -u "$JENKINS_USER:$JENKINS_TOKEN" \
                -H "ngrok-skip-browser-warning: true" \
                "$JENKINS_URL/job/$JENKINS_JOB/$BUILD_NUMBER/logText/progressiveText?start=$LAST_OFFSET" 2>/dev/null || echo "")
              
              if [ -n "$FINAL_RESPONSE" ] && ! echo "$FINAL_RESPONSE" | grep -q "<html\|404"; then
                LINE_COUNT=$(echo "$FINAL_RESPONSE" | wc -l)
                if [ "$LINE_COUNT" -gt 1 ]; then
                  FINAL_CONTENT=$(echo "$FINAL_RESPONSE" | head -n -1)
                  if [ -n "$FINAL_CONTENT" ]; then
                    echo "$FINAL_CONTENT"
                  fi
                fi
              fi
              
              echo ""
              echo "=== Build Result ==="
              if [ "$RESULT" = "SUCCESS" ]; then
                echo "✓ Jenkins build completed successfully!"
                echo "Build URL: $JENKINS_URL/job/$JENKINS_JOB/$BUILD_NUMBER"
                exit 0
              elif [ "$RESULT" = "FAILURE" ] || [ "$RESULT" = "ABORTED" ] || [ "$RESULT" = "UNSTABLE" ]; then
                echo "✗ Jenkins build failed with result: $RESULT"
                echo "Build URL: $JENKINS_URL/job/$JENKINS_JOB/$BUILD_NUMBER"
                exit 1
              else
                echo "⚠ Jenkins build completed with unknown result: $RESULT"
                exit 1
              fi
            fi
            
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          
          echo ""
          echo "✗ Timeout waiting for build to complete (waited ${MAX_WAIT}s)"
          exit 1

